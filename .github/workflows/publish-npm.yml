name : Publish to npm
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          registry-url:'https://registry.npmjs.org'
      - run: npm publish --access = public
        working-directory:Packages/com.iwahana.bitassisttools
        env: NODE_AUTH_TOKEN: ${{secrets.PERSONAL_TOKEN}}

